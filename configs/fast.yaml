# Small/fast configuration used by CI and smoke tests.
seed: 42
n_jobs: -1
models_dir: models
reports_dir: reports

candidates: [dummy, logreg, lgbm]

data:
  raw_path: data/raw/creditcard.csv
  drop_duplicates: true

split:
  test_fraction: 0.20
  cv_splits: 3
  cv_gap_rows: 200

cost:
  review_cost: 5.0

tuning:
  n_trials: 4

evaluation:
  bootstrap_samples: 100
  alert_budgets: [0.005, 0.01]
  cv_alert_rate: 0.01
